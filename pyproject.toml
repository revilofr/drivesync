[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivesync"
version = "0.1.0"
description = "Thin CLI wrapper around rclone for local directory sync workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
	{name = "revilofr"},
]
license = "MIT"
classifiers = [
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
drivesync = "drivesync.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["drivesync*"]